<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="ProfilePhoto.jpeg">
    <title>Ankitha Gowda</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #0f172a;
            --bg-sidebar: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100%;
            position: relative;
        }

        /* Sidebar Styling - Visible by default on desktop */
        .sidebar {
            width: 290px;
            min-width: 290px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        /* Collapsed state on desktop */
        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            opacity: 0;
            pointer-events: none;
            border-right-color: transparent;
        }

        .sidebar-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: var(--bg-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
            flex-shrink: 0;
        }

        .profile-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.08);
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #10b981;
            animation: pulse 2s infinite;
        }

        .close-sidebar-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            margin-left: auto;
            padding: 4px 8px;
            line-height: 1;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .close-sidebar-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .sidebar h2 {
            font-size: 16px;
            font-weight: 600;
            padding: 20px 24px 8px 24px;
            color: var(--text-primary);
        }

        .sidebar p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
            padding: 0 24px 16px 24px;
        }

        /* Search Bar */
        .search-container {
            margin: 0 24px 16px 24px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-container input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 9px 12px 9px 36px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0 24px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            margin: 16px 0 8px 0;
            padding-left: 12px;
        }

        #links, .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 13px;
            line-height: 1.4;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .sidebar-nav a.active {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Scrollbars */
        .sidebar-nav::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Preview Area styling - Edge-to-Edge Layout */
        .preview {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            height: 100vh;
            position: relative;
        }

        /* Preview Header styled like a utility toolbar */
        .preview-header {
            height: 52px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
        }

        /* Toggle Button inside Toolbar */
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .header-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-blue);
        }

        .address-bar {
            margin-left: auto;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .iframe-container {
            flex-grow: 1;
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 0;
                min-width: 0;
                opacity: 0;
                box-shadow: var(--glass-shadow);
            }
            
            .sidebar.visible {
                width: 280px;
                min-width: 280px;
                opacity: 1;
            }

            .close-sidebar-btn {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="profile-avatar">AG</div>
            <div class="profile-info">
                <h3>Ankitha Gowda</h3>
                <span class="status-pill"><span class="status-dot"></span>Active</span>
            </div>
            <button class="close-sidebar-btn" id="closeSidebarBtn" aria-label="Close Sidebar">&times;</button>
        </div>

        <h2>📝 Articles</h2>

        <p>
            Explore my technical write-ups, engineering experiments,
            cloud learnings, and GenAI projects.
        </p>

        <!-- Search Bar -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search articles..." aria-label="Search articles">
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-nav">
            <!-- Home Profile link -->
            <a href="welcome.html" target="previewFrame" class="active" id="homeLink">
                🏠 Home Profile
            </a>
            
            <div class="nav-section-title">Technical Writings</div>
            <div id="links" aria-live="polite"></div>
        </div>
    </div>

    <!-- Main Preview Area -->
    <div class="preview">
        <div class="preview-header">
            <!-- Toggle Sidebar Button inside header toolbar -->
            <button class="toggle-btn" id="toggleBtn" aria-label="Toggle Navigation Sidebar">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            
            <div class="header-title">
                <span class="header-title-dot"></span>
                <span>Ankitha Gowda • Portfolio</span>
            </div>
            <div class="address-bar" id="addressBar">welcome.html</div>
        </div>

        <div class="iframe-container">
            <iframe
                id="previewFrame"
                name="previewFrame"
                src="welcome.html"
                title="Preview Area">
            </iframe>
        </div>
    </div>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const searchInput = document.getElementById('searchInput');
    const iframe = document.getElementById('previewFrame');
    const addressBar = document.getElementById('addressBar');
    const homeLink = document.getElementById('homeLink');

    let allArticles = [];

    // Toggle button click listener
    toggleBtn.addEventListener('click', () => {
        if (window.innerWidth > 768) {
            sidebar.classList.toggle('collapsed');
        } else {
            sidebar.classList.toggle('visible');
        }
    });

    // Close button click listener (mobile drawer only)
    closeSidebarBtn.addEventListener('click', () => {
        sidebar.classList.remove('visible');
    });

    // Home link click listener
    homeLink.addEventListener('click', () => {
        document.querySelectorAll('#links a').forEach(el => el.classList.remove('active'));
        homeLink.classList.add('active');
        addressBar.textContent = 'welcome.html';
        
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('visible');
        }
    });

    // Listen for message from iframe (welcome.html button)
    window.addEventListener('message', async (event) => {
        const isShowArticles = event.data === 'showArticles' || (event.data && event.data.type === 'showArticles');
        if (!isShowArticles) {
            return;
        }

        if (window.innerWidth > 768) {
            sidebar.classList.remove('collapsed');
        } else {
            sidebar.classList.add('visible');
        }
        await populateLinks();
    });

    // Convert filename to readable title
    function friendlyTitle(name) {
        return name
            .replace(/\.html?$/i, '')
            .replace(/[-_]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    // Render list links
    function renderLinks(files) {
        const container = document.getElementById('links');
        container.innerHTML = '';

        if (files.length === 0) {
            container.innerHTML = '<p style="color: var(--text-secondary); font-size: 13px; text-align: center; padding: 20px 0;">No articles found</p>';
            return;
        }

        files.forEach(file => {
            const a = document.createElement('a');
            
            // Clean up file path
            const relativePath = file.startsWith('published/') ? file : `published/${file}`;
            a.href = relativePath;
            a.target = 'previewFrame';
            
            const cleanName = file.replace(/^published\//, '');
            a.textContent = `📄 ${friendlyTitle(cleanName)}`;

            // Highlight link if current frame matches
            const currentFrameSrc = addressBar.textContent;
            if (currentFrameSrc === relativePath) {
                a.classList.add('active');
                homeLink.classList.remove('active');
            }

            a.addEventListener('click', () => {
                document.querySelectorAll('#links a').forEach(el => el.classList.remove('active'));
                homeLink.classList.remove('active');
                a.classList.add('active');
                addressBar.textContent = relativePath;

                // Auto-close sidebar on mobile after clicking
                if (window.innerWidth <= 768) {
                    sidebar.classList.remove('visible');
                }
            });

            container.appendChild(a);
        });
    }

    // Fallback list of articles when fetch requests fail (e.g. running on file:// protocol)
    const hardcodedArticles = [
        "API-Code-generation-using-Swagger-in-Springboot.html",
        "API-gateway-in-Spring-boot.html",
        "API-invocation-in-Groovy-Java-without-any-dependencies-jars.html",
        "Access-Amazon-S3-bucket-from-Java-Springboot.html",
        "ActiveMQ-in-Spring-boot-using-JMSTemplate.html",
        "Convert--xsd-files-to-Java-classes.html",
        "Different-ways-to-send-mails-from-springboot-application.html",
        "Enable-authentication-and-configure-ActiveMQ-in-Java-application.html",
        "ExecutorService-in-Java.html",
        "Implement-LRU--Least-Recently-Used--Cache-in-JAVA.html",
        "JWT-authentication-and-role-based-authorization-in-Springboot.html",
        "Log-request-and-responses-of-REST-APIs-in-SpringBoot.html",
        "Make-command-line-arguments-easier-using-JCommander-in-Java.html",
        "Pipeline-Design-pattern.html",
        "Policies-of-ThreadPoolExecutor-in-Java.html",
        "Singleton-Design-Pattern-in-Java.html",
        "Spring-Batch-Overview.html",
        "Spring-Retry-Overview.html",
        "Update-Hostname-dynamically-in-Spring-Cloud-Gateway.html",
        "Ways-to-log-database-queries-in-Spring-JDBC.html",
        "Web-Services-with-VertX-in-Springboot.html",
        "What-is-Aspect-Oriented-Programming--AOP--in-Spring.html",
        "gRPC-implementation-in-Springboot-and-microservices.html",
        "logDatabaseQueries.html",
        "waysToSendMails.html"
    ];

    // Populate links dynamically
    async function populateLinks() {
        const container = document.getElementById('links');

        // Avoid duplicate loading if already loaded
        if (allArticles.length > 0) {
            return;
        }

        container.innerHTML = '<p style="color: var(--text-secondary); font-size: 13px; text-align: center; padding: 20px 0;">Loading articles...</p>';

        try {
            // Preferred approach using manifest
            const res = await fetch('published/list.json');
            if (!res.ok) {
                throw new Error('Manifest not found');
            }

            const files = await res.json();
            allArticles = files;
            renderLinks(allArticles);

        } catch (err) {
            // Fallback approach 1: fetch index list from published directory
            try {
                const res = await fetch('published/');
                if (!res.ok) {
                    throw new Error('Fallback folder fetch failed');
                }
                const txt = await res.text();
                const doc = new DOMParser().parseFromString(txt, 'text/html');
                const anchors = Array.from(doc.querySelectorAll('a'));
                const files = anchors
                    .map(a => a.getAttribute('href'))
                    .filter(h => /\.html?$/.test(h));

                if (!files || files.length === 0) {
                    throw new Error('No files parsed from folder');
                }
                allArticles = files;
                renderLinks(allArticles);

            } catch (e) {
                // Fallback approach 2: local hardcoded list (essential for file:// protocol)
                console.warn("Dynamic loading failed. Falling back to built-in article list. Details:", e.message);
                allArticles = hardcodedArticles;
                renderLinks(allArticles);
            }
        }
    }

    // Search bar functionality
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allArticles.filter(file => {
            const cleanName = file.replace(/^published\//, '');
            const title = friendlyTitle(cleanName).toLowerCase();
            return title.includes(query);
        });
        renderLinks(filtered);
    });

    // Automatically update address bar when iframe content changes (if same-origin)
    iframe.addEventListener('load', () => {
        try {
            const loc = iframe.contentWindow.location;
            const pathname = loc.pathname;
            const rootPathIndex = pathname.lastIndexOf('/oldfr.github.io/');
            let relativePath = '';
            
            if (rootPathIndex !== -1) {
                relativePath = pathname.substring(rootPathIndex + '/oldfr.github.io/'.length);
            } else {
                // fallback to last parts
                const parts = pathname.split('/');
                if (parts[parts.length - 2] === 'published') {
                    relativePath = `published/${parts[parts.length - 1]}`;
                } else {
                    relativePath = parts[parts.length - 1];
                }
            }
            
            if (relativePath && relativePath !== 'blank') {
                addressBar.textContent = relativePath;
                
                if (relativePath === 'welcome.html' || relativePath === '') {
                    homeLink.classList.add('active');
                    document.querySelectorAll('#links a').forEach(el => el.classList.remove('active'));
                } else {
                    homeLink.classList.remove('active');
                    // Keep sidebar link highlighting in sync
                    document.querySelectorAll('#links a').forEach(el => {
                        const hrefAttr = el.getAttribute('href');
                        if (hrefAttr === relativePath || hrefAttr === `published/${relativePath}`) {
                            el.classList.add('active');
                        } else {
                            el.classList.remove('active');
                        }
                    });
                }
            }
        } catch (e) {
            console.warn("Could not read iframe location: ", e.message);
        }
    });

    // Populate list automatically on document load
    window.addEventListener('DOMContentLoaded', async () => {
        await populateLinks();
    });

</script>

</body>
</html>
