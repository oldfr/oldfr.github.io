<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankitha Gowda</title>
    <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh; /* full viewport height */
      overflow: hidden;
    }

    /* Left panel for links */
    .sidebar {
      width: 25%;
      min-width: 200px;
      background-color: aquamarine;
      padding: 20px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      overflow: auto;
      display: none;
    }

    .sidebar.visible {
      display: block;
    }

    .sidebar a {
      display: block;
      margin-bottom: 10px;
      text-decoration: none;
      color: #333;
      padding: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover {
      background-color: #ddd;
    }

    /* Right panel for preview */
    .preview {
      background-color: #ddd;
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    </style>
    
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h2>Articles</h2>
    <p>Click any title to preview it on the right.</p>
    <div id="links" aria-live="polite"></div>
  </div>

  <div class="preview">
    <iframe name="previewFrame" src="welcome.html" title="Preview Area"></iframe>
  </div>

  <script>
  const sidebar = document.getElementById('sidebar');

  // Listen for message from iframe (welcome.html)
  window.addEventListener('message', (event) => {
    if (event.data === 'showArticles') {
      sidebar.classList.add('visible');
      populateLinks();
    }
  });

  // Build a friendly title from filename
  function friendlyTitle(name) {
    // remove extension
    const n = name.replace(/\.html?$/i, '');
    // replace common separators with spaces
    return n.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  // Populate links from published/list.json (fallback to directory listing)
  async function populateLinks() {
    const container = document.getElementById('links');
    if (container.innerHTML !== '' && container.innerHTML !== '<p>Loading…</p>') {
      return; // already populated
    }
    container.innerHTML = '<p>Loading…</p>';
    try {
      const res = await fetch('published/list.json');
      if (!res.ok) throw new Error('No manifest');
      const files = await res.json();
      container.innerHTML = '';
      files.forEach(f => {
        const p = document.createElement('p');
        const a = document.createElement('a');
        a.href = `published/${f}`;
        a.target = 'previewFrame';
        a.textContent = friendlyTitle(f);
        p.appendChild(a);
        container.appendChild(p);
      });
    } catch (err) {
      // fallback: attempt to fetch directory listing and parse links
      try {
        const res = await fetch('published/');
        const txt = await res.text();
        const doc = new DOMParser().parseFromString(txt, 'text/html');
        const anchors = Array.from(doc.querySelectorAll('a'));
        const files = anchors.map(a => a.getAttribute('href')).filter(h => /\.html?$/.test(h));
        container.innerHTML = '';
        files.forEach(f => {
          const p = document.createElement('p');
          const a = document.createElement('a');
          a.href = `published/${f}`;
          a.target = 'previewFrame';
          a.textContent = friendlyTitle(f);
          p.appendChild(a);
          container.appendChild(p);
        });
      } catch (e) {
        container.innerHTML = '<p>Unable to load articles.</p>';
        console.error(e);
      }
    }
  }
  </script>
</body>
</html>
